<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="rig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.80"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- ── CAMERA BODY ── -->
  <rect x="100" y="64" width="270" height="130" rx="28" fill="url(#rig)"/>
  <!-- Lens ring outer -->
  <circle cx="215" cy="129" r="52" fill="rgba(76,29,149,0.22)" stroke="white" stroke-width="10"/>
  <!-- Lens ring inner -->
  <circle cx="215" cy="129" r="32" fill="rgba(76,29,149,0.50)" stroke="white" stroke-width="6"/>
  <!-- Lens glass -->
  <circle cx="215" cy="129" r="16" fill="rgba(109,40,217,0.75)"/>
  <circle cx="207" cy="121" r="6" fill="rgba(255,255,255,0.35)"/>

  <!-- Viewfinder bump -->
  <rect x="292" y="48" width="60" height="32" rx="10" fill="white" fill-opacity="0.85"/>

  <!-- Record LED -->
  <circle cx="334" cy="76" r="14" fill="#ef4444" fill-opacity="0.90"/>
  <circle cx="334" cy="76" r="7" fill="#fca5a5" fill-opacity="0.70"/>

  <!-- Hot shoe rail -->
  <rect x="102" y="57" width="60" height="12" rx="4" fill="white" fill-opacity="0.50"/>

  <!-- ── CENTER SLED POST ── -->
  <rect x="244" y="194" width="24" height="82" rx="12" fill="white" fill-opacity="0.85"/>

  <!-- ── BALANCE ARM (horizontal) ── -->
  <rect x="72" y="264" width="368" height="28" rx="14" fill="white" fill-opacity="0.78"/>
  <!-- Arm pivot circle -->
  <circle cx="256" cy="278" r="20" fill="white" fill-opacity="0.92"/>
  <circle cx="256" cy="278" r="10" fill="rgba(109,40,217,0.55)"/>

  <!-- ── MONITOR (left arm) ── -->
  <rect x="52" y="228" width="80" height="60" rx="12" fill="white" fill-opacity="0.72"/>
  <!-- Monitor screen -->
  <rect x="60" y="236" width="64" height="44" rx="7" fill="rgba(109,40,217,0.40)"/>
  <!-- Screen content lines -->
  <rect x="66" y="244" width="36" height="4" rx="2" fill="rgba(255,255,255,0.50)"/>
  <rect x="66" y="252" width="48" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="66" y="260" width="28" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
  <!-- Monitor arm connector -->
  <rect x="130" y="260" width="20" height="8" rx="4" fill="white" fill-opacity="0.60"/>

  <!-- ── BATTERY / COUNTERWEIGHT SLED ── -->
  <rect x="164" y="330" width="184" height="118" rx="26" fill="url(#rig)"/>
  <!-- Battery cells -->
  <rect x="184" y="350" width="60" height="16" rx="7" fill="rgba(109,40,217,0.30)"/>
  <rect x="256" y="350" width="76" height="16" rx="7" fill="rgba(109,40,217,0.22)"/>
  <!-- Charge bar -->
  <rect x="184" y="376" width="148" height="12" rx="6" fill="rgba(109,40,217,0.18)"/>
  <rect x="184" y="376" width="96" height="12" rx="6" fill="rgba(109,40,217,0.45)"/>
  <!-- Label -->
  <rect x="196" y="400" width="120" height="8" rx="4" fill="rgba(109,40,217,0.20)"/>

  <!-- ── SUBTLE GLOW RING ── -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
